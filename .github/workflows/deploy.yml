name: Deploy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install nbconvert pyyaml
      - name: Validate laboratory content
        run: python bin/validate_site.py
      - name: Set GitHub Pages URL
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          owner = os.environ["OWNER"]
          repo = os.environ["REPOSITORY"].split("/", 1)[1]
          base = "" if repo.lower() == f"{owner.lower()}.github.io" else f"/{repo}"
          Path("_config.deploy.yml").write_text(yaml.safe_dump({"url": f"https://{owner.lower()}.github.io", "baseurl": base}))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SITE_BASEURL={base}\n")
          PY
      - name: Build existing Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.github-pages.yml,_config.deploy.yml --trace
      - name: Check fresh HTML and local links
        run: python bin/validate_site.py --built _site --baseurl "$SITE_BASEURL"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
